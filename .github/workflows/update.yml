name: Androide_epg

on:
  schedule:
    - cron: '0 */3 * * *'  # Ogni 3 ore
  workflow_dispatch:

jobs:
  update-androide_epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests lxml
      
      - name: Download EPG
        id: download
        run: |
          python scripts/fetch_openepg.py
          
          if git diff --quiet -- cache/epg_raw.xml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate JSON
        run: python scripts/generate_epg-androide.py

      - name: Commit
        env:
          TZ: Europe/Rome
        run: |
          git config user.name " 🤖 Androide Update Bot"
          git config user.email "bot@androide_epg.com"
          git add cache/ json/
          git commit -m " Update $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
