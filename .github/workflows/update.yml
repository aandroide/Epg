name: DEBUG - Test Script

on:
  workflow_dispatch:

jobs:
  test-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3
        with:
          ref: test
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Install dependencies
        run: pip install requests lxml
      
      - name: 🌐 Download EPG
        run: python scripts/fetch_openepg.py
      
      - name: 🔍 Verifica file EPG
        run: |
          echo "=== File scaricato ==="
          ls -lah cache/
          echo ""
          echo "=== Prime righe EPG ==="
          head -20 cache/epg_raw.xml
      
      - name: 🔄 Esegui script (con output completo)
        run: |
          echo "=== ESECUZIONE SCRIPT ==="
          python scripts/generate_androide_epg.py
          EXIT_CODE=$?
          echo ""
          echo "Exit code: $EXIT_CODE"
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Script fallito!"
            exit 1
          fi
      
      - name: 📂 Mostra risultati
        run: |
          echo "=== Contenuto json/ ==="
          ls -lah json/
          echo ""
          echo "=== sky_epg.json (prime righe) ==="
          head -30 json/sky_epg.json || echo "File non esiste!"
          echo ""
          echo "=== dazn_epg.json (prime righe) ==="
          head -30 json/dazn_epg.json || echo "File non esiste!"
      
      - name: ✅ Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: json-files
          path: json/*.json
