name: Androide EPG - Auto Update

on:
  schedule:
    - cron: '0 */3 * * *'  # Ogni 3 ore
  workflow_dispatch:

jobs:
  update-androide-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name:  Checkout branch test
        uses: actions/checkout@v3
        with:
          ref: test
          fetch-depth: 1
      
      - name:  Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name:  Install dependencies
        run: pip install requests lxml
      
      - name:  Download EPG
        id: download
        run: |
          python scripts/fetch_openepg.py
          
          if git diff --quiet cache/epg_raw.xml 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name:  Generate JSON
        if: steps.download.outputs.changed == 'true'
        run: python scripts/generate_androide_epg.py
      
      - name:  Commit su branch test
        if: steps.download.outputs.changed == 'true'
        run: |
          git config user.name "Androide Update Bot"
          git config user.email "bot@androide.epg"
          git add cache/ json/
          
          # Usa fuso orario italiano
          export TZ='Europe/Rome'
          git commit -m " EPG Update $(date +'%Y-%m-%d %H:%M') [TEST]" || exit 0
          git push origin HEAD:test
